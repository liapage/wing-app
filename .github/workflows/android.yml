name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships NDK 27.3.x and CMake 3.31.x, but React Native /
      # Expo pin NDK 27.1.12297006 and AGP asks for CMake 3.22.1, so every job
      # downloads ~1 GB of SDK components before compiling anything. Cache the
      # exact versions the build wants; a miss just means the old behaviour.
      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk-27.1.12297006-cmake-3.22.1-${{ runner.os }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Configure release signing
        env:
          WING_KEYSTORE_BASE64: ${{ secrets.WING_KEYSTORE_BASE64 }}
          WING_KEYSTORE_PASSWORD: ${{ secrets.WING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$WING_KEYSTORE_BASE64" ] || [ -z "$WING_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add WING_KEYSTORE_BASE64 and WING_KEYSTORE_PASSWORD repository secrets (see README)."
            exit 1
          fi

          mkdir -p .secrets
          printf '%s' "$WING_KEYSTORE_BASE64" | base64 -d > .secrets/wing-release.keystore

          {
            echo "storeFile=.secrets/wing-release.keystore"
            echo "storePassword=$WING_KEYSTORE_PASSWORD"
            echo "keyAlias=wing"
            echo "keyPassword=$WING_KEYSTORE_PASSWORD"
          } > .secrets/keystore.properties
          chmod 600 .secrets/wing-release.keystore .secrets/keystore.properties

      - name: Configure Firebase
        env:
          WING_GOOGLE_SERVICES_JSON: ${{ secrets.WING_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$WING_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the WING_GOOGLE_SERVICES_JSON repository secret (contents of google-services.json, see README)."
            exit 1
          fi
          mkdir -p .secrets
          printf '%s' "$WING_GOOGLE_SERVICES_JSON" > .secrets/google-services.json

      - name: Build signed APK
        run: |
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Verify APK
        run: |
          set -euo pipefail
          apk="$(ls dist/*.apk | head -1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"

          unzip -p "$apk" assets/index.android.bundle > /tmp/index.android.bundle
          strings /tmp/index.android.bundle | grep -q "1560800700575785090"
          echo "Verified $apk is signed and contains the production Discord client ID."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wing-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
